name: Build and Deploy POC
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'docker'
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      image_tag:
        description: 'Image tag'
        required: false
        default: 'latest'
      service_name:
        description: 'Cloud Run service name'
        required: true
        default: 'devo-test-agent'
      region:
        description: 'Google Cloud Region'
        required: true
        default: 'us-central1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    environment: ${{ inputs.environment }} # <-- ADD THIS LINE
    outputs:
      image_url: ${{ steps.build_step.outputs.IMAGE_URL }}
      image_tag: ${{ steps.build_step.outputs.IMAGE_TAG }}
      image_sha: ${{ steps.build_step.outputs.IMAGE_SHA }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Docker auth
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Construct Image URL and Build
        id: build_step
        run: |
          REPO_NAME="devo-test-agent"
          IMAGE_URL="${{ inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO_NAME}/${{ inputs.service_name }}"
          IMAGE_SHA="${{ github.sha }}"
          IMAGE_TAG="${{ inputs.image_tag }}"

          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV

          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_OUTPUT

          gcloud builds submit --tag "$IMAGE_URL:$IMAGE_SHA" --tag "$IMAGE_URL:$IMAGE_TAG" --project=${{ secrets.GCP_PROJECT_ID }} .
          echo "Built and pushed $IMAGE_URL:$IMAGE_SHA and $IMAGE_URL:$IMAGE_TAG"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }} # This job already had it
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TO_DEPLOY="${{ needs.build-and-push.outputs.image_url }}:${{ needs.build-and-push.outputs.image_sha }}"
          echo "Deploying image: $IMAGE_TO_DEPLOY"
          gcloud run deploy ${{ inputs.service_name }} \
            --image=$IMAGE_TO_DEPLOY \
            --platform=managed \
            --region=${{ inputs.region }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --allow-unauthenticated --quiet
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
