name: Mock Deploy Workflow
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: echo "Simulating npm install..." && sleep 5
      - name: Build project
        run: echo "Simulating npm run build..." && sleep 10
        id: build_step
      - name: Output build status
        run: echo "Build step completed"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run tests
        run: echo "Simulating tests..." && sleep 15
      - name: Output test status
        run: echo "Tests passed"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Deploy to ${{ github.event.inputs.environment }}
        run: |
          echo "Simulating deployment to ${{ github.event.inputs.environment }}..."
          sleep 10
          echo "Deployment to ${{ github.event.inputs.environment }} complete!"
      - name: Output deploy status
        run: echo "Deployment complete"
