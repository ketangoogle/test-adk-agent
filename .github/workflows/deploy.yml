name: Build and Deploy POC
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'docker'
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      image_tag:
        description: 'Primary image tag (e.g., latest)'
        required: false
        default: 'latest'
      service_name:
        description: 'Cloud Run service name'
        required: true
        default: 'devo-test-agent'
      region:
        description: 'Google Cloud Region'
        required: true
        default: 'us-central1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    environment: ${{ inputs.environment }}
    outputs:
      image_tag: ${{ steps.build_step.outputs.IMAGE_TAG }}
      image_sha: ${{ steps.build_step.outputs.IMAGE_SHA }}
      image_url_base: ${{ steps.build_step.outputs.IMAGE_URL_BASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Docker auth
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        id: build_step
        run: |
          REPO_NAME="devo-test-agent"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ inputs.region }}"
          SERVICE_NAME="${{ inputs.service_name }}"
          IMAGE_URL_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}"
          
          IMAGE_SHA="${{ github.sha }}"
          INPUT_TAG="${{ inputs.image_tag }}" # e.g., latest

          if [ -z "$IMAGE_SHA" ]; then
            echo "Error: github.sha is empty!"
            exit 1
          fi

          # Output variables for the next job
          echo "IMAGE_TAG=$INPUT_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_OUTPUT
          echo "IMAGE_URL_BASE=$IMAGE_URL_BASE" >> $GITHUB_OUTPUT

          IMAGE_WITH_INPUT_TAG="$IMAGE_URL_BASE:$INPUT_TAG"
          IMAGE_WITH_SHA_TAG="$IMAGE_URL_BASE:$IMAGE_SHA"

          echo "----------------------------------------------------"
          echo "Building and pushing with tags:"
          echo " - $IMAGE_WITH_INPUT_TAG"
          echo " - $IMAGE_WITH_SHA_TAG"
          echo "----------------------------------------------------"

          # Build and push BOTH tags atomically
          gcloud builds submit \
            --tag "$IMAGE_WITH_INPUT_TAG" \
            --tag "$IMAGE_WITH_SHA_TAG" \
            --project="${PROJECT_ID}" \
            .

          echo "----------------------------------------------------"
          echo "Verifying tags in Artifact Registry:"
          gcloud artifacts docker images list "${IMAGE_URL_BASE}" --include-tags --project="${PROJECT_ID}"
          echo "----------------------------------------------------"

        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }}
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URL_BASE="${{ needs.build-and-push.outputs.image_url_base }}"
          IMAGE_SHA="${{ needs.build-and-push.outputs.image_sha }}"
          IMAGE_TO_DEPLOY="$IMAGE_URL_BASE:$IMAGE_SHA"

          echo "Deploying image: $IMAGE_TO_DEPLOY"
          if [ -z "$IMAGE_SHA" ]; then
            echo "Error: IMAGE_SHA from outputs is empty!"
            exit 1
          fi

          gcloud run deploy ${{ inputs.service_name }} \
            --image=$IMAGE_TO_DEPLOY \
            --platform=managed \
            --region=${{ inputs.region }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
